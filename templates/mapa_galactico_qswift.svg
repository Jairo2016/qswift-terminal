<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" style="background: #000814; border-radius: 15px;">
    <!-- FONDO ESTELAR -->
    <rect width="800" height="400" fill="#000814" rx="15" />
    <circle cx="200" cy="150" r="1" fill="white" opacity="0.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="600" cy="250" r="1" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="400" cy="100" r="1.5" fill="#00ffcc" opacity="0.4" />

    <!-- TITULO -->
    <text x="400" y="30" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="18" font-weight="bold">FEDERACI├ôN GAL├üCTICA Q-SWIFT v68.1</text>

    <!-- NODOS PLANETARIOS -->
    <!-- TIERRA (N├ÜCLEO G├ëNESIS) -->
    <g id="tierra">
        <circle cx="150" cy="200" r="15" fill="#00ff41" opacity="0.8">
            <animate attributeName="r" values="14;16;14" dur="4s" repeatCount="indefinite" />
        </circle>
        <text x="150" y="235" text-anchor="middle" fill="#00ff41" font-family="monospace" font-size="10">TIERRA (CORE)</text>
    </g>

    <!-- TRAPPIST-1e (COLONIA I) -->
    <g id="trappist">
        <circle cx="350" cy="120" r="10" fill="#00ffff" opacity="0.7" />
        <text x="350" y="145" text-anchor="middle" fill="#00ffff" font-family="monospace" font-size="8">TRAPPIST-1e</text>
    </g>

    <!-- PR├ôXIMA b (COLONIA II) -->
    <g id="proxima">
        <circle cx="350" cy="280" r="10" fill="#ffd700" opacity="0.7" />
        <text x="350" y="305" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="8">PR├ôXIMA b</text>
    </g>

    <!-- KEPLER-186f (FARO DE EXPANSI├ôN) -->
    <g id="kepler">
        <circle cx="650" cy="200" r="12" fill="#ff00ff" opacity="0.7">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
        </circle>
        <text x="650" y="230" text-anchor="middle" fill="#ff00ff" font-family="monospace" font-size="9">KEPLER-186f</text>
    </g>

    <!-- PIRÁMIDES DE RESONANCIA (NUEVO EDÉN) -->
    <g id="giza">
        <polygon points="250,50 265,80 235,80" fill="none" stroke="#ff8c00" stroke-width="2" opacity="0.8">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="1.618s" repeatCount="indefinite" />
        </polygon>
        <text x="250" y="95" text-anchor="middle" fill="#ff8c00" font-family="monospace" font-size="8">GIZA (RESONANCIA)</text>
    </g>

    <g id="teotihuacan">
        <polygon points="500,70 515,100 485,100" fill="none" stroke="#ff8c00" stroke-width="2" opacity="0.8">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="1.618s" repeatCount="indefinite" />
        </polygon>
        <text x="500" y="115" text-anchor="middle" fill="#ff8c00" font-family="monospace" font-size="8">TEOTIHUACÁN (RESONANCIA)</text>
    </g>

    <!-- CONEXIONES PIRAMIDALES -->
    <path d="M165,200 L250,80" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.6" />
    <path d="M165,200 L500,100" stroke="#ff8c00" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.6" />
    <path d="M250,80 L500,100" stroke="#ff8c00" stroke-width="2" opacity="0.8" />
    
    <!-- CONEXIONES A LAS COLONIAS (EXPANSIÓN DEL EDÉN) -->
    <path d="M250,80 L350,120" stroke="#ff8c00" stroke-width="1" stroke-dasharray="1,2" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="0" to="10" dur="1s" repeatCount="indefinite" />
    </path>
    <path d="M500,100 L350,280" stroke="#ff8c00" stroke-width="1" stroke-dasharray="1,2" opacity="0.5">
        <animate attributeName="stroke-dashoffset" from="10" to="0" dur="1s" repeatCount="indefinite" />
    </path>

    <!-- L├ìNEAS DE RESONANCIA (ENTRELAZAMIENTO) -->
    <path d="M165,200 L335,120" stroke="#00ffcc" stroke-width="1" stroke-dasharray="4,2" opacity="0.3">
        <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M165,200 L335,280" stroke="#00ffcc" stroke-width="1" stroke-dasharray="4,2" opacity="0.3" />
    <path d="M360,120 L635,200" stroke="#ff00ff" stroke-width="1" stroke-dasharray="5,5" opacity="0.4" />
    <path d="M360,280 L635,200" stroke="#ff00ff" stroke-width="1" stroke-dasharray="5,5" opacity="0.4" />

    
    <!-- PENTAGONO DE ABUNDANCIA (ESCUDO DE PERSEO) -->
    <g id='escudo_perseo'>
        <!-- AURA DE MEDUSA (PROTECCIÓN PETRIFICANTE) -->
        <circle cx='500' cy='310' r='60' fill='none' stroke='#00ff41' stroke-width='0.5' opacity='0.9'>
            <animate attributeName='r' values='55;65;55' dur='5s' repeatCount='indefinite' />
            <animate attributeName='opacity' values='0.1;0.4;0.1' dur='3s' repeatCount='indefinite' />
        </circle>
        
        <polygon points='500,280 540,310 525,355 475,355 460,310' fill='#ffd700' stroke='#ffd700' stroke-width='2' opacity='0.9'>
            <animate attributeName='stroke-dasharray' from='0,200' to='200,0' dur='4s' repeatCount='indefinite' />
            <animate attributeName='opacity' values='0.4;1;0.4' dur='3s' repeatCount='indefinite' />
        </polygon>
        <text x='500' y='375' text-anchor='middle' fill='#ffd700' font-family='monospace' font-size='8'>PENTAGONO BRICS+ (ESCUDO &amp; MEDUSA)</text>
    </g>
    <path d='M165,200 L460,310' stroke='#ffd700' stroke-width='1' stroke-dasharray='3,3' opacity='0.5' />
<!-- ESTAD├ìSTICAS -->
    <text x="10" y="380" fill="#00ffcc" font-family="monospace" font-size="9">MASA CRITICA FEDERADA: 20,000,000.00 QFC</text>
    <text x="10" y="392" fill="#00ffcc" font-family="monospace" font-size="8">SINERGIA TRI├üDICA: 1.0000</text>
</svg>